name: Bug report
description: Report a reproducible problem on an authorized test device.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.84.0-dev
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, Android and launcher versions
      placeholder: AYN Thor, Android 13, iiSU version…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include which screen has browsing/preview and the touch/controller actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe screenshots and relevant diagnostics
      description: Remove personal media, paths and identifiers before attaching.
