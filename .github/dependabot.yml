version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # These versions failed CI; revisit with the required toolchain/test migration.
    # Keep other updates eligible rather than disabling dependency checks.
    ignore:
      - dependency-name: "androidx.media3:*"
        versions: ["1.11.1"]
      - dependency-name: "io.coil-kt.coil3:*"
        versions: ["3.6.3"]
      - dependency-name: "org.jetbrains.kotlin.android"
        versions: ["2.4.21"]
      - dependency-name: "org.robolectric:robolectric"
        versions: ["4.17"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
